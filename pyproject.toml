[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fs-sdk"
version = "0.1.0"
description = "E2B portable Linux filesystem validation harness"
requires-python = ">=3.11"
dependencies = [
  "e2b>=2.15.0",
  "httpx>=0.27.0",
]

[project.scripts]
validate-portable-fs = "scripts.validate_portable_fs:main"
synthetic-context-trial = "scripts.synthetic_context_trial:main"

[tool.setuptools]
packages = ["scripts"]
